name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install root deps
        run: npm install
      - name: Install function deps
        run: |
          cd functions
          npm install
      - name: Lint
        run: npm run lint --prefix functions
      - name: Build
        run: npm run build --prefix functions
      - name: Test
        run: npm run test --prefix functions
